name: Probe UG
on:
  workflow_dispatch:
    inputs:
      q: { description: 'Search', default: 'riptide' }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          UA='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36'
          Q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "${{ inputs.q }}")
          curl -sSL -A "$UA" -H 'Accept: text/html,application/xhtml+xml,*/*;q=0.8' -H 'Accept-Language: en-US,en;q=0.9' \
            -o probe/search.html -w '%{http_code} %{url_effective}\n' \
            "https://www.ultimate-guitar.com/search.php?search_type=title&value=$Q" > probe/search.status || true
          head -c 3000000 probe/search.html > probe/s.tmp && mv probe/s.tmp probe/search.html
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe" || true; git push
